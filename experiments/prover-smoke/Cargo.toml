
[package]
name = "sapling-output-smoke"
version = "0.1.0"
edition = "2021"

[dependencies]
sapling-crypto = { git = "https://github.com/zcash/sapling-crypto", rev = "88a7946b4a3066787776e11f0a502654167e022d", features = ["circuit"] }
bls12_381 = "0.9"
ff = "0.14"
group = "0.14"
jubjub = "0.11"
rand = { version = "0.10", features = ["std_rng"] }
zcash_note_encryption = "0.5.1"
bellman = { path = "../../vendor/bellman" }
blst = { version = "0.3.15", features = ["no-threads"] }
blake2b_simd = "1"
sha2 = "0.10.9"
groth16 = { path = "../../vendor/groth16" }

[patch.crates-io]
groth16 = { path = "../../vendor/groth16" }
bellman = { path = "../../vendor/bellman" }