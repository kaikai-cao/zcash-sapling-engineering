name: ci

# Parameter-free CI for the Sapling proving engineering study.
#
# Scope notes:
#   * Real Sapling proofs need external parameter files (~51 MB, not in-repo);
#     nothing here downloads or stores them. End-to-end proof reproduction is a
#     separate, documented procedure (docs/reproduction.md).
#   * Vendored crates (vendor/bellman, vendor/groth16) are upstream mirrors plus
#     this study's instrumentation: they are compile-checked and test-gated, but
#     not lint-gated. Rustfmt and clippy -D warnings apply to both study crates
#     (experiments/prover-smoke, experiments/transaction-smoke).
#   * The default-on optimization switches are guarded by the gates job — three
#     as of 2026-10-18: SAPLING_MSM_SIGNED_DIGITS (adopted by target b) plus the
#     two flipped by target g (SAPLING_MSM_LAZY_RECODING,
#     SAPLING_FFT_SERIAL_SINGLE_THREAD):
#     the FFT path gate must produce identical digests whether
#     SAPLING_FFT_SERIAL_SINGLE_THREAD is unset (flipped default) or explicitly
#     =0 (legacy four-step path), and the MSM bench cross-checks signed/unsigned
#     recoding and lazy/materialised exponents on every run.
#   * The gates job prints the certified digest set to the log so that runs on
#     different platforms (this Ubuntu runner vs the Windows measurement host)
#     can be compared bit-for-bit from the logs alone; see docs/reproduction.md
#     section 4.

on:
  push:
    # 2026-10-30: 补上 "experiments/**"。此前的模式是 "experiment/**"（单数），
    # 而实际长期实验分支叫 experiments/e2e-testnet-tx-harness，**从未匹配上**——
    # 结果就是该分支的每次 push 都不跑 CI，新增的 e2e-analysis job 形同虚设。
    # 保留单数模式以兼容历史分支命名。
    branches: [main, "experiment/**", "experiments/**",
               "analysis/**", "profiling/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy (study crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --check --manifest-path experiments/prover-smoke/Cargo.toml
      - name: clippy (deny warnings)
        run: >
          cargo clippy --locked --all-targets
          --manifest-path experiments/prover-smoke/Cargo.toml
          -- -D warnings

  check-vendor:
    name: vendored crates compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check bellman
        run: cargo check --locked --manifest-path vendor/bellman/Cargo.toml
      - name: cargo check groth16
        run: cargo check --locked --manifest-path vendor/groth16/Cargo.toml

  test-libs:
    name: library tests (bellman + groth16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: bellman tests (multiexp / recoding / FFT paths)
        # --lib --tests: the vendored crate-level doctest needs dev-dependencies
        # the mirror does not declare (upstream artifact, not our code); the 49
        # unit tests plus integration tests are the meaningful gate.
        run: cargo test --locked --lib --tests --manifest-path vendor/bellman/Cargo.toml
      - name: groth16 tests
        run: cargo test --locked --lib --tests --manifest-path vendor/groth16/Cargo.toml

  build:
    name: experiment binaries build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build --release
        run: cargo build --release --locked --manifest-path experiments/prover-smoke/Cargo.toml

  check-tx-smoke:
    name: transaction crate fmt + clippy + check (locked, parameter-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The transaction-construction harness is a separate crate with its own
      # lockfile and its own [patch.crates-io] pins. Lint and compile-check it on
      # every change so the benchmark code cannot rot between measurement
      # campaigns. No parameter files are needed: this job never runs a proof.
      - name: rustfmt
        run: cargo fmt --check --manifest-path experiments/transaction-smoke/Cargo.toml
      - name: clippy (deny warnings)
        run: >
          cargo clippy --locked --all-targets
          --manifest-path experiments/transaction-smoke/Cargo.toml
          -- -D warnings
      - name: cargo check --locked
        run: cargo check --locked --all-targets --manifest-path experiments/transaction-smoke/Cargo.toml

  gates:
    name: deterministic correctness gates (no params needed)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build gates (release)
        run: cargo build --release --locked --manifest-path experiments/prover-smoke/Cargo.toml
      - name: FFT path gate - digests identical across switch states
        run: |
          set -euo pipefail
          export RAYON_NUM_THREADS=1
          BIN=experiments/prover-smoke/target/release/fft_path_gate
          digests() { "$@" | grep -o 'blake2b=[0-9a-f]*' ; }
          digests "$BIN" > gate_default.txt
          digests env SAPLING_FFT_SERIAL_SINGLE_THREAD=0 "$BIN" > gate_legacy.txt
          digests env SAPLING_MSM_LAZY_RECODING=0 "$BIN" > gate_lazy0.txt
          echo "--- digests: flipped default vs legacy four-step (=0) ---"
          diff -u gate_legacy.txt gate_default.txt
          echo "--- digests: flipped default vs lazy=0 ---"
          diff -u gate_lazy0.txt gate_default.txt
          count=$(grep -c . gate_default.txt)
          echo "FFT path gate: $count digests identical across all switch states"
          echo "--- certified digest set (compare bit-for-bit across platforms) ---"
          cat gate_default.txt
          "$BIN" | grep -q "FFT_PATH_GATE_DONE"
      - name: MSM gate - signed/unsigned recoding and lazy/materialised exponents agree
        env:
          RAYON_NUM_THREADS: 1
          MSM_WINDOW_BENCH_N: 16384
          MSM_WINDOW_BENCH_C: 13
          MSM_WINDOW_BENCH_REPS: 1
        run: |
          set -euo pipefail
          experiments/prover-smoke/target/release/msm_window_bench \
            | tee msm_gate.txt
          grep -q "correctness=cross_recoding c=13 ok" msm_gate.txt
          grep -q "MSM_WINDOW_BENCH=DONE" msm_gate.txt
          echo "MSM gate: cross-recoding equality verified (exit code asserts the rest)"

  e2e-analysis:
    name: end-to-end Sapling analysis (deterministic, no node)
    runs-on: ubuntu-latest
    # The confirmatory campaign itself cannot run in CI (needs a live WSL2 regtest
    # node + Zallet backend + a 32297-height chain snapshot). What CAN be gated is
    # everything downstream of the archived data: the failure-class self-test, and
    # the claim that "the reported numbers follow from the committed rounds.csv".
    # If someone edits the CSV or the statistics code, this job fails — which is
    # exactly what a frozen result should do.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install analysis deps (NumPy pinned)
        run: python -m pip install --disable-pip-version-check -r experiments/e2e_testnet_tx/requirements-analysis.txt

      - name: confirmed NumPy presence
        # Guards against the earlier "31 PASS / 1 SKIP" ambiguity: S11 of the
        # self-test needs NumPy, so a SKIP there meant "environment incomplete",
        # not "test not applicable". Fail fast instead of skipping silently.
        run: python -c "import numpy; print('numpy', numpy.__version__)"

      - name: executor + failure-class self-test (stdlib only, isolated, no node)
        run: python experiments/e2e_testnet_tx/failure_class_selftest.py

      - name: isolated harness (fakes all external I/O, drives real main/run_one paths)
        # 132 assertions over the paths that never execute in a green campaign:
        # G4 verdicts (dup keys / illegal values / foreign keys / real JSON via CLI),
        # D1a-unknown, D3 A/B/C, M7 tie-break, underpowered. Kept in-repo so the
        # evidence is reproducible rather than living in an external audit bundle.
        run: python experiments/e2e_testnet_tx/isolated_harness.py

      - name: archived rounds.csv -> reported statistics (reproducibility gate)
        working-directory: experiments/e2e_testnet_tx
        run: |
          set -euo pipefail
          python fit_sapling_e2e_model.py \
            --raw-dir raw/confirmatory_20261030 --require-match --md /tmp/FIT.ci.md
          echo "--- H_A / H_B / H_C ---"
          python h_ab_bootstrap.py | tee /tmp/hab.ci.txt
          grep -q "513.11, 552.96" /tmp/hab.ci.txt      # H_A 95% CI, RESULTS.md §5
          grep -q "483.10, 783.20" /tmp/hab.ci.txt      # H_B 95% CI, RESULTS.md §5
          grep -q "接受 H_A" /tmp/hab.ci.txt
          grep -q "接受 H_C" /tmp/hab.ci.txt
          echo "--- order sensitivity (exploratory, DEVIATIONS §6) ---"
          python order_sensitivity.py | tee /tmp/order.ci.txt
